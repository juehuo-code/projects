<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>患者监护系统</title>
<link rel="stylesheet" href="css/style.css">
<script src="lib/chart.umd.min.js"></script>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div id="login-page">
  <div class="login-card">
    <h1>🏥 患者监护系统</h1>
    <p class="sub">Patient Monitoring System</p>
    <div class="field"><label>账号</label><input id="login-user" placeholder="请输入账号"></div>
    <div class="field"><label>密码</label><input id="login-pass" type="password" placeholder="请输入密码"></div>
    <button onclick="App.login()">登 录</button>
    <p class="err" id="login-err"></p>
    <p style="margin-top:14px;font-size:12px;color:var(--text-light);">默认账号: admin / 123456 (管理员) &nbsp;|&nbsp; doctor1 / 123456 (医护)</p>
  </div>
</div>

<!-- ========== 主应用 ========== -->
<div id="app">
  <!-- 侧边栏 -->
  <aside id="sidebar">
    <div class="logo">🏥 患者监护系统</div>
    <div class="user-info" id="sidebar-user"></div>
    <nav id="nav"></nav>
    <button class="logout-btn" onclick="App.logout()">🚪 退出登录</button>
  </aside>

  <!-- 主内容 -->
  <div id="main">
    <div id="topbar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button> <span id="page-title">工作台</span></div>

    <!-- 工作台首页 -->
    <div class="page" id="page-dashboard"></div>

    <!-- 患者管理 -->
    <div class="page" id="page-patients"></div>

    <!-- 生理数据 -->
    <div class="page" id="page-vitals"></div>

    <!-- 异常预警 -->
    <div class="page" id="page-alerts"></div>

    <!-- 监护日志 -->
    <div class="page" id="page-logs"></div>

    <!-- 病情报告 -->
    <div class="page" id="page-reports"></div>

    <!-- 管理员：用户管理 + 系统日志 -->
    <div class="page" id="page-admin"></div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
